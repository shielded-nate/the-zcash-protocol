name: Publish multi-branch docs

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  call_action:
    uses: shielded-nate/multi-branch-pages/.github/workflows/publish-multi-branch-pages.yml@v1
    with:
      branch_whitelist: "*"
      render_command: |
        nix build
        rm -rf book
        cp -aL result/. book
      render_output_dir: book
